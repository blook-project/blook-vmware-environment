name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build + unit tests (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Configure
        run: xmake f -y -m releasedbg

      - name: Build
        run: xmake -y

      - name: Unit tests
        run: xmake run bvmenv-tests

      - name: CLI smoke test
        shell: pwsh
        run: |
          $exe = '.\build\windows\x64\releasedbg\bvmenv.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'version failed' }
          & $exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'help failed' }
          # The runner has no VMware Workstation, so `doctor` must degrade
          # gracefully (JSON error, non-zero exit) instead of crashing.
          $json = & $exe doctor --json 2>&1 | Out-String
          Write-Host $json
          $report = $json | ConvertFrom-Json -ErrorAction Stop
          if ($report.schema -ne 'bvmenv.doctor.v1') { throw 'doctor output is not valid JSON' }
          if ($report.ok) {
            Write-Host 'doctor reports a working VMware host'
          } else {
            Write-Warning "doctor ok=false (expected without VMware): $($report.config_error)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bvmenv-windows-x64
          path: |
            build/windows/x64/releasedbg/bvmenv.exe
            build/windows/x64/releasedbg/bvmenv-tests.exe
            build/windows/x64/releasedbg/guest-nested-virt-check.exe
          if-no-files-found: error

  format:
    name: clang-format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format (pinned)
        shell: pwsh
        run: |
          python -m pip install --quiet clang-format==20.1.0
          $dir = python -c "import site,os;print(os.path.join(site.getsitepackages()[-1],'clang_format','data','bin'))"
          if (-not (Test-Path (Join-Path $dir 'clang-format.exe'))) {
            choco install llvm --no-progress -y
            $dir = 'C:\Program Files\LLVM\bin'
          }
          Write-Host "clang-format dir: $dir"
          $dir | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          & (Join-Path $dir 'clang-format.exe') --version

      - name: Check formatting
        run: |
          $files = Get-ChildItem -Recurse -Include *.cc,*.h -File src,include,tests |
            Where-Object { $_.FullName -notmatch '\\build\\' }
          if (-not $files) { Write-Error 'no sources found'; exit 1 }
          $failed = $false
          foreach ($f in $files) {
            clang-format --dry-run --Werror --style=file $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { Write-Error 'clang-format check failed'; exit 1 }
          Write-Host "clang-format ok for $($files.Count) files"

  guest-drivers:
    name: in-guest test drivers (WDK)
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Detect WDK
        id: wdk
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Windows Kits\10'
          $roots = Get-ChildItem "$root\Include" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^10\.' }
          if (-not $roots) { Write-Host 'WDK not present on this image, skipping'; exit 0 }
          $ver = $roots[-1].Name
          Write-Host "WDK $ver found"
          "present=true" | Out-File -Append $env:GITHUB_OUTPUT
          "wdk_dir=$root" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Build guest drivers
        if: steps.wdk.outputs.present == 'true'
        shell: pwsh
        env:
          WDKContentRoot: ${{ steps.wdk.outputs.wdk_dir }}
        run: |
          # xmake's WDK rule needs to be told where the WDK lives on CI images.
          xmake f -y --guest_drivers=y --wdk="$env:WDKContentRoot"
          xmake -y guest-vtx-probe
          xmake -y guest-bsod-driver
          xmake -y guest-hang-driver

  release-zip:
    name: package zip (release build, static runtime)
    runs-on: windows-latest
    needs: [build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Build with static runtime
        shell: pwsh
        run: |
          $env:BVMENV_VERSION = (Get-Content version.txt -Raw).Trim()
          xmake f -y -m release --static_runtime=y
          xmake -y bvmenv
          if (-not (Test-Path build/windows/x64/release/bvmenv.exe)) { throw 'bvmenv.exe missing' }

      - name: Assemble package
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          $stage = "pkg/blook-vmware-environment-$version"
          New-Item -ItemType Directory -Force -Path "$stage/bin/x64" | Out-Null
          Copy-Item build/windows/x64/release/bvmenv.exe "$stage/bin/x64/"
          Copy-Item guest,docs,scripts -Destination $stage -Recurse
          Copy-Item README.md,LICENSE,CHANGELOG.md,version.txt,xmake-package -Destination $stage -Recurse
          Compress-Archive -Path "$stage/*" -DestinationPath "blook-vmware-environment-$version-windows-x64.zip"
          (Get-FileHash "blook-vmware-environment-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii "blook-vmware-environment-$version-windows-x64.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            blook-vmware-environment-*-windows-x64.zip
            blook-vmware-environment-*-windows-x64.zip.sha256
          if-no-files-found: error
