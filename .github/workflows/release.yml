name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: build + publish release package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.version }}') {
            $version = '${{ github.event.inputs.version }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $version = (Get-Content version.txt -Raw).Trim()
          }
          Write-Host "version=$version"
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-cache

      - name: Build (static runtime)
        shell: pwsh
        run: |
          $env:BVMENV_VERSION = '${{ steps.version.outputs.version }}'
          xmake f -y -m release --static_runtime=y
          xmake -y bvmenv
          if (-not (Test-Path build/windows/x64/release/bvmenv.exe)) { throw 'bvmenv.exe missing' }

      - name: Unit tests
        shell: pwsh
        run: |
          xmake f -y -m releasedbg
          xmake -y bvmenv-tests
          xmake run bvmenv-tests

      - name: Assemble package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $name = "blook-vmware-environment-$version"
          $stage = "pkg/$name"
          New-Item -ItemType Directory -Force -Path "$stage/bin/x64" | Out-Null
          Copy-Item build/windows/x64/release/bvmenv.exe "$stage/bin/x64/"
          foreach ($dir in 'guest','docs','scripts') {
            if (Test-Path $dir) { Copy-Item $dir -Destination $stage -Recurse }
          }
          foreach ($file in 'README.md','LICENSE','CHANGELOG.md','version.txt') {
            if (Test-Path $file) { Copy-Item $file -Destination $stage }
          }
          if (Test-Path 'xmake-package') { Copy-Item 'xmake-package' -Destination $stage -Recurse }
          # Strip lab-only evidence blobs from the package (keep the index).
          if (Test-Path "$stage/docs/evidence") {
            Get-ChildItem "$stage/docs/evidence" -Recurse -File |
              Where-Object { $_.Extension -in '.png','.log' } |
              Remove-Item -Force
          }
          $zip = "$name-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "version=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          generate_release_notes: true
          files: |
            blook-vmware-environment-${{ steps.version.outputs.version }}-windows-x64.zip
            blook-vmware-environment-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
          fail_on_unmatched_files: true

      - name: Publish xmake package manifest (informational)
        shell: pwsh
        run: |
          Write-Host "Registry manifest for xmake-package/xmake.lua:"
          Get-Content xmake-package/xmake.lua -ErrorAction SilentlyContinue
          Write-Host ""
          Write-Host "To update blook-project/blook-xmake-repo run:"
          Write-Host "  pwsh scripts/publish-registry.ps1 -Package blook-vmware-environment -Version $env:version"
